<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raymond AI | Full Entertainment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
        header {
            margin-top: 2rem;
        }
        .badge {
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(168, 85, 247, 0.4);
            display: inline-block;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #e879f9, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        footer {
            margin-bottom: 1rem;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="badge">🚀 Official Release</div>
        <h1>Raymond AI</h1>
        <p>Get ready for full entertainment, cinematic visuals, and next-level AI storytelling.</p>
    </header>

    <main class="card">
        <h3 style="margin-bottom: 1rem; color: #f1f5f9;">Something Big is Here</h3>
        <p style="font-size: 0.95rem; margin-bottom: 1.5rem;">Everybody make una ready for better video ooooooo! Experience the ultimate cinematic journey.</p>
        <a href="#" class="btn" onclick="alert('Welcome to Raymond AI! Stay tuned for more updates.')">Explore Preview</a>
    </main>

    <footer>
        <p>&copy; 2026 Raymond AI. All rights reserved.</p>
    </footer>

</body>
</html>
